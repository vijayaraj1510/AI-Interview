{% extends "base.html" %}
{% block page_title %}Settings{% endblock %}
{% block content %}<section class="panel glass"><h2>Assessment Settings</h2><form method="post" class="grid-form"><label>Default Question Count<input class="form-control" type="number" name="default_question_count" value="{{ settings.default_question_count }}"></label><label>Default Test Time<input class="form-control" type="number" name="default_test_time" value="{{ settings.default_test_time }}"></label><label class="form-check form-switch"><input class="form-check-input" type="checkbox" name="random_questions" value="on" {% if settings.random_questions=='on' %}checked{% endif %}> Random Questions</label><label class="form-check form-switch"><input class="form-check-input" type="checkbox" name="negative_marking" value="on" {% if settings.negative_marking=='on' %}checked{% endif %}> Negative Marking</label><button class="btn btn-primary">Save Settings</button></form></section>{% endblock %}
