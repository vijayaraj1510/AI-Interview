<div class="table-responsive">
<table class="table table-hover align-middle">
  <thead><tr><th>Date</th><th>Assessment</th><th>Topic</th><th>Score</th><th>Time</th><th>Action</th></tr></thead>
  <tbody>
  {% for item in recent or stats.attempts %}
  <tr><td>{{ item.created_at }}</td><td>{{ item.assessment_type|title }}</td><td>{{ item.topic }}</td><td>{{ item.percentage }}%</td><td>{{ item.time_taken }}s</td><td><a class="btn btn-sm btn-outline-info" href="{{ url_for('assessment_result', qtype=item.assessment_type, id=item.id) }}">View Result</a></td></tr>
  {% else %}<tr><td colspan="6" class="empty">No assessment history yet.</td></tr>{% endfor %}
  </tbody>
</table>
</div>
